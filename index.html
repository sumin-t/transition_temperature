<title>상태변화 온도 시뮬레이션</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 태블릿 가로 화면 기준. 맨 위 탭, 그 아래 도구 한 줄, 안내 한 줄, 아래는 장치(왼쪽)와 그래프(오른쪽). 세로 화면에서는 위아래로 쌓음. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface2:#F4F7F8; --ink:#13232C; --muted:#56676F;
  --line:#D3DCE1; --line-strong:#9FB0B9;
  --hot:#C9461D; --hot-bg:#FBE9E2; --cold:#1D63A8; --cold-bg:#E3EEF8;
  --acc:var(--hot); --acc-bg:var(--hot-bg); --acc-ink:#FFFFFF;
  --ok:#1E7A4C; --warn:#7D5200; --warn-bg:#FBF0D6; --bad:#B3261E; --bad-bg:#FBE4E2;
  --grid:#BFCBD2; --plot-bg:#FFFFFF; --axis:#13232C;
  --r1:#C9461D; --r2:#1D63A8; --r3:#1E8A5A; --r4:#7A47B8; --r5:#B07A00; --r6:#0E8A8C;
  --b1:#1D63A8; --b2:#4C9BE0; --b3:#123F73; --b4:#0E8A8C; --b5:#7DB6EE; --b6:#2E4FB0;
  --d1:#C62828; --d2:#E8743B; --d3:#8E1B3A; --d4:#E0568A; --d5:#A63D00; --d6:#F08A7E;
  --glass:#5E7A88; --liq-water:#8EC9F0; --liq-eth:#E8D28A; --metal:#8A9AA3; --plate:#3B4A53; --plate-top:#5B6C76;
  --solid:#F4F6F7; --solid-ice:#CFEAF7; --melt-acid:#EBCF7A; --table:#C9D3D8;
  --font-body:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono","D2Coding",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A20; --surface:#17252D; --surface2:#1C2D36; --ink:#E6EEF2; --muted:#9DB0BA;
    --line:#2B404B; --line-strong:#4A6574;
    --hot:#FF8F66; --hot-bg:#3A2219; --cold:#6DB2F0; --cold-bg:#16293A; --acc-ink:#1B0E08;
    --ok:#5FD39B; --warn:#F0C45A; --warn-bg:#35290F; --bad:#FF8A80; --bad-bg:#3A1C1A;
    --grid:#34505D; --plot-bg:#122027; --axis:#E6EEF2;
    --r1:#FF8F66; --r2:#6DB2F0; --r3:#5FD39B; --r4:#C39BF2; --r5:#E8B84A; --r6:#4FD0D2;
  --b1:#6DB2F0; --b2:#9CCBF7; --b3:#4A86C8; --b4:#4FD0D2; --b5:#BFDDFA; --b6:#7F95F0;
  --d1:#FF7A70; --d2:#FFA66B; --d3:#E0607E; --d4:#F78FB5; --d5:#E8905A; --d6:#FFC0B5;
    --glass:#8FB0C0; --liq-water:#3F86B5; --liq-eth:#A48F3E; --metal:#6F838E; --plate:#0C1318; --plate-top:#33444E;
    --solid:#D9DFE2; --solid-ice:#8FC5DD; --melt-acid:#A88F3C; --table:#22333C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A20; --surface:#17252D; --surface2:#1C2D36; --ink:#E6EEF2; --muted:#9DB0BA;
  --line:#2B404B; --line-strong:#4A6574;
  --hot:#FF8F66; --hot-bg:#3A2219; --cold:#6DB2F0; --cold-bg:#16293A; --acc-ink:#1B0E08;
  --ok:#5FD39B; --warn:#F0C45A; --warn-bg:#35290F; --bad:#FF8A80; --bad-bg:#3A1C1A;
  --grid:#34505D; --plot-bg:#122027; --axis:#E6EEF2;
  --r1:#FF8F66; --r2:#6DB2F0; --r3:#5FD39B; --r4:#C39BF2; --r5:#E8B84A; --r6:#4FD0D2;
  --b1:#6DB2F0; --b2:#9CCBF7; --b3:#4A86C8; --b4:#4FD0D2; --b5:#BFDDFA; --b6:#7F95F0;
  --d1:#FF7A70; --d2:#FFA66B; --d3:#E0607E; --d4:#F78FB5; --d5:#E8905A; --d6:#FFC0B5;
  --glass:#8FB0C0; --liq-water:#3F86B5; --liq-eth:#A48F3E; --metal:#6F838E; --plate:#0C1318; --plate-top:#33444E;
  --solid:#D9DFE2; --solid-ice:#8FC5DD; --melt-acid:#A88F3C; --table:#22333C;
  color-scheme:dark;
}
#app[data-tab="melt"]{ --acc:var(--cold); --acc-bg:var(--cold-bg); }
*{box-sizing:border-box}
.foot{margin-top:6px;padding:14px 8px 4px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:12px 24px;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0 auto 0 0;font-size:22px;line-height:1.25;font-weight:700}
.tabs{display:flex;gap:6px}
.tabs button{min-height:48px;padding:8px 20px;border:2px solid var(--line);background:var(--surface);border-radius:10px;font-size:17px;font-weight:700}
.tabs button[aria-selected="true"]{border-color:var(--acc);background:var(--acc-bg)}
.tabs button[data-tab="boil"][aria-selected="true"]{border-color:var(--hot);background:var(--hot-bg)}
.tabs button[data-tab="melt"][aria-selected="true"]{border-color:var(--cold);background:var(--cold-bg)}
.btn{min-height:48px;padding:8px 16px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;font-weight:600}
.btn.armed{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
/* 도구 */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tool{position:relative}
.tool .main{width:100%;min-height:98px;border:2px solid var(--line);background:var(--surface2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;padding:8px 4px 6px}
.tool .main[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-bg)}
.tool svg{width:44px;height:44px;flex:none;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool svg .w{fill:var(--liq-water);stroke:none} .tool svg .e{fill:var(--liq-eth);stroke:none} .tool svg .ic{fill:var(--solid-ice)}
.tool svg .p{fill:var(--solid)} .tool svg .m{fill:var(--metal)} .tool svg .a{fill:var(--acc);stroke:var(--acc)}
.tool .cap{font-size:11px;line-height:1.3;color:var(--muted);font-weight:500;margin-top:3px;word-break:keep-all}
.tool .nm{font-weight:700;font-size:15px;line-height:1.25;margin-top:2px;word-break:keep-all}
.tool .cnt{font-family:var(--font-num);font-size:14px;font-weight:600;color:var(--acc);min-height:20px}
.tool .main[aria-pressed="false"] .cnt{color:var(--muted);font-weight:500}
.tool .x{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);font-size:15px;line-height:1;padding:0}
/* 안내 한 줄 */
.guide{margin:0;min-height:50px;padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--acc);font-size:18px;font-weight:600;display:flex;align-items:center}
.guide.warn{border-left-color:var(--warn);background:var(--warn-bg)}
/* 본문 */
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:10px;align-items:start}
.scenebox{background:var(--surface2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scenebox svg{display:block;width:100%;height:auto;max-height:calc(100vh - 380px);min-height:230px}
.bar{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.read{display:flex;align-items:baseline;gap:4px;font-family:var(--font-num);font-weight:600;min-width:120px}
.read .big{font-size:40px;line-height:1}
.read small{font-size:16px;color:var(--muted)}
.clock{font-family:var(--font-num);font-size:22px;font-weight:600;color:var(--muted)}
.btn-heat{flex:1 1 170px;min-height:56px;font-size:18px;font-weight:700;background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn-cool{flex:1 1 150px;min-height:56px;font-size:18px;font-weight:700;background:var(--cold-bg);border:2px solid var(--cold);color:var(--ink)}
.btn-heat.on{background:var(--surface2);color:var(--ink);border-color:var(--ink)}
.safety{margin:10px 0 0;padding:6px 10px;border-left:5px solid var(--warn);background:var(--warn-bg);border-radius:6px;font-size:14px}
/* 장치 SVG */
.sc-table{fill:var(--table)} .sc-metal{fill:var(--metal)} .sc-plate-body{fill:var(--plate)} .sc-plate-top{fill:var(--plate-top)}
.sc-led{fill:var(--line-strong)} .sc-led.on{fill:#FF4B3A} .sc-knob{fill:var(--plate-top);stroke:var(--line-strong);stroke-width:1.5}
.sc-glow{fill:#FF7A3C;transition:opacity .3s}
.sc-glass{fill:none;stroke:var(--glass);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.sc-liq-water{fill:var(--liq-water);opacity:.85} .sc-liq-eth{fill:var(--liq-eth);opacity:.85}
.sc-bath{fill:var(--liq-water);opacity:.5}
.sc-chip{fill:var(--ink);opacity:.6}
.sc-sensor{fill:var(--acc)} .sc-sensor-line{stroke:var(--ink);stroke-width:2.5;fill:none}
.sc-cable{stroke:var(--ink);stroke-width:2;fill:none;opacity:.6}
.sc-solid{fill:var(--solid);stroke:var(--glass);stroke-width:1} .sc-solid.ice{fill:var(--solid-ice)}
.sc-melt{fill:var(--melt-acid);opacity:.9} .sc-melt.ice{fill:var(--liq-water)}
.sc-lbl{fill:#fff;font-size:12px;font-weight:700}
.sc-steam{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round;opacity:0}
.sc-bub{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1.5;opacity:0}
.boiling .sc-bub{opacity:1;animation:rise 1.1s linear infinite}
.boiling .sc-steam{animation:steam 1.8s ease-in-out infinite}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-44px);opacity:0}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-16px)}}
@media (prefers-reduced-motion: reduce){
  .boiling .sc-bub,.boiling .sc-steam{animation:none}
  .boiling .sc-steam{opacity:.5}
}
/* 그래프 */
.gwrap{border:1px solid var(--line);border-radius:10px;background:var(--plot-bg);overflow:hidden}
.gwrap svg{display:block;width:100%;height:auto;max-height:calc(100vh - 330px);min-height:260px}
.g-bg{fill:var(--plot-bg)} .g-major{stroke:var(--grid);stroke-width:1.2} .g-axis{stroke:var(--axis);stroke-width:2}
.g-tick{fill:var(--ink);font-size:13px;font-family:var(--font-num)} .g-title{fill:var(--ink);font-size:14px;font-weight:600}
.g-tag{font-size:13px;font-weight:700;font-family:var(--font-ui,inherit)} .g-tagbg{fill:var(--plot-bg);stroke-width:2;opacity:.95}
.g-run{fill:none;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.runs{list-style:none;margin:8px 0 0;padding:0;display:flex;gap:6px;flex-wrap:wrap;min-height:40px}
.runs li{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);font-weight:600}
.runs .dot{width:12px;height:12px;border-radius:50%;flex:none}
.runs button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);padding:0;font-size:14px}
.runs .empty{border:none;background:none;color:var(--muted);font-weight:400;padding-left:2px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,26,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.mbox{background:var(--surface);color:var(--ink);border:2px solid var(--acc);border-radius:16px;padding:22px 24px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px}
.mbox h2{margin:0;font-size:21px}
.mbox p{margin:0;font-size:17px;line-height:1.6}
.mbox .btn{flex:none;width:100%;min-height:52px}
.modal.cool .mbox{border-color:var(--cold)}
.modal.cool .btn-heat{background:var(--cold);border-color:var(--cold);color:var(--bg)}
@media (max-width:860px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .scenebox svg,.gwrap svg{max-height:none}
}
@media (max-width:520px){
  h1{font-size:19px}
  .tabs button{padding:8px 12px;font-size:16px}
  .tools{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
<div class="app" id="app" data-tab="boil">
  <header class="top">
    <h1>🌡️ 상태변화 온도 시뮬레이션</h1>
    <div class="tabs" role="tablist" aria-label="실험 종류">
      <button role="tab" data-tab="boil" aria-selected="true" type="button">끓는점 실험</button>
      <button role="tab" data-tab="melt" aria-selected="false" type="button">녹는점 실험</button>
    </div>
    <button id="resetAll" class="btn" type="button">전체 초기화</button>
  </header>

  <section class="card" aria-label="실험 도구"><div class="tools" id="tools"></div></section>
  <p class="guide" id="guide" role="status" aria-live="polite"></p>

  <main class="cols">
    <section class="card" aria-label="실험 장치">
      <div class="scenebox"><svg id="scene" viewBox="0 0 420 340" role="img" aria-label="실험 장치 그림"></svg></div>
      <div class="bar">
        <div class="read" aria-label="온도 센서 값"><span class="big" id="tNow">--.-</span><small>℃</small></div>
        <div class="clock" id="timeNow" aria-label="경과 시간">00:00</div>
        <button class="btn btn-heat" id="heat" type="button">가열장치 켜기</button>
        <button class="btn btn-cool" id="cool" type="button" hidden>❄️ 냉각하기</button>
      </div>
      <p class="safety" id="safety"></p>
    </section>
    <section class="card" aria-label="온도-시간 그래프">
      <div class="gwrap"><svg id="graph" role="img" aria-label="온도 시간 그래프"></svg></div>
      <ul class="runs" id="runs"></ul>
    </section>
  </main>
  <footer class="foot">중학교 2학년 과학 · 끓는점과 녹는점 (Ⅰ. 물질의 특성)<br>©수민T의 과학 실험실. All rights reserved.</footer>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mbox">
    <h2 id="mTitle"></h2>
    <p id="mBody"></p>
    <button class="btn btn-heat" id="mOk" type="button">확인</button>
  </div>
</div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

/* ===== 물질 데이터 · 물리 상수 (값을 바꾸려면 여기만 수정) ===== */
var ROOM=20, SOLSTEP=100, SOLMAX=200, SPEED={boil:0.5,melt:0.5}; /* 화면 1초 = 실험 0.5분 */
var LIQ={ /* bp 끓는점(℃), rho 밀도(g/mL), c 비열(J/g·K), L 증발열(J/g) */
  water:{name:'물', bp:100, rho:1, c:4.18, L:2257, step:10, max:50},
  ethanol:{name:'에탄올', bp:78.2, rho:0.789, c:2.44, L:855, step:10, max:20}
};
var SOL={ /* mp 녹는점(℃), t0 처음 온도, cs/cl 고체·액체 비열, Lf 융해열(J/g), pc 식을 때 빠져나가는 열량(W), tmin 냉각을 멈추는 온도(℃) */
  ice:{name:'얼음', mp:0, t0:-10, cs:2.1, cl:4.18, Lf:334, pc:300, tmin:-10},   /* 얼음은 0 ℃ 아래까지 식혀야 하므로 더 차가운 곳(얼음-소금물 등)에서 식힌다고 가정 */

/* 장치 상수: 플라스크로 들어가는 열량(W)이 일정하다고 단순화. PW 핫플레이트 직접 가열, PE 에탄올(물중탕), PM 녹는점(물중탕). FC 플라스크 열용량(J/K). 물중탕이라 온도는 100 ℃를 넘지 못함 */
var P={PW:34,PE:12,PM:200,FC:70,FCM:100,TSTOP:150,COOLWAIT:5,COOLTEMP:85,TMAXM:90};
/* 녹는점 실험: PM 가열 열량(W), FCM 플라스크 열용량(J/K), COOLWAIT 다 녹은 뒤 냉각 안내까지 걸리는 시간(분), COOLTEMP 이 온도에 먼저 닿으면 그때 냉각 안내, TMAXM 녹은 뒤 시료가 오를 수 있는 최고 온도(℃) */
function tmaxMin(tab){return 20}

/* ===== 도구 ===== */
var ITEMS={
  water:{n:'물',kind:'liq'}, ethanol:{n:'에탄올',kind:'liq'},
  ice:{n:'얼음',kind:'sol'}, palm:{n:'팔미트산',kind:'sol'},
  flask:{n:'삼각플라스크',kind:'eq'},
  beaker:{n:'비커',kind:'eq',cap:'물중탕: 불이 붙기 쉬운 물질을 안전하게 가열해요.'},
  sensor:{n:'온도 센서',kind:'eq'},
  chip:{n:'끓임쪽',kind:'eq',cap:'갑자기 끓어 넘치는 것을 막아 줘요.'}
};
var SHELF={
  boil:['flask','beaker','water','ethanol','sensor','chip'],
  melt:['flask','beaker','water','ice','palm','sensor','chip']
};
/* 실험마다 꼭 필요한 도구(need)와 쓰면 안 되는 도구(ban). 끓임쪽은 물 실험에서는 있어도 없어도 됨 */
var NEED={
  water:{need:['flask','sensor'],ban:['beaker']},
  ethanol:{need:['flask','beaker','bath','chip','sensor'],ban:[]},
  melt:{need:['flask','beaker','bath','sensor'],ban:['chip']}
};

/* ===== 상태 ===== */
var S={
  tab:'boil',
  sel:{
    boil:{liq:null,vol:0,flask:0,beaker:0,bath:0,sensor:0,chip:0},
    melt:{sol:null,g:0,flask:0,beaker:0,bath:0,sensor:0,chip:0}
  },
  heater:false, cur:null, runs:[], uid:0, note:''
};
function sel(){return S.sel[S.tab]}
function evalSetup(){
  var s=sel(), key=S.tab==='boil'?s.liq:(s.sol?'melt':null);
  if(!key) return {key:null,ok:false,missing:[],extra:[]};
  var N=NEED[key];
  var missing=N.need.filter(function(x){return !s[x]});
  var extra=N.ban.filter(function(x){return s[x]});
  return {key:key,ok:!missing.length&&!extra.length,missing:missing,extra:extra};
}

/* ===== 온도 모델: 1초 간격 에너지 계산 (가열 → 상태변화 → 다 변한 뒤 다시 가열) ===== */
function simulate(r,coolAt){
  if(coolAt===undefined) coolAt=-1;
  var tmax=tmaxMin(r.tab)*60, N=tmax+1;
  var T=new Float32Array(N), ph=new Uint8Array(N), fr=new Float32Array(N);
  var lq=r.tab==='boil'?LIQ[r.liq]:null, so=r.tab==='melt'?SOL[r.sol]:null;
  var bath=!!so||r.liq==='ethanol';
  var pw=so?P.PM:(r.liq==='ethanol'?P.PE:P.PW);
  var m=lq?r.vol*lq.rho:r.g, m0=m, temp=lq?ROOM:so.t0, phi=0, state=0, tend=tmax, i, j;
  /* 녹는점 상태: 0 고체, 1 녹는 중, 2 액체, 3 어는 중, 4 다시 고체 */
  for(i=0;i<N;i++){
    T[i]=temp; ph[i]=state; fr[i]=lq?m/m0:phi;
    if(lq&&temp>=P.TSTOP){tend=i;for(j=i;j<N;j++){T[j]=temp;ph[j]=state;fr[j]=0}break}
    if(so&&state===4&&temp<=so.tmin+1e-6){tend=i;for(j=i;j<N;j++){T[j]=temp;ph[j]=state;fr[j]=0}break}
    if(lq){
      if(state===0){temp+=pw/(m*lq.c+P.FC);if(temp>=lq.bp){temp=lq.bp;state=1}}
      else if(state===1){m-=pw/lq.L;if(m<=0){m=0;state=2}}
      else{temp+=pw/P.FC;if(bath&&temp>100)temp=100}
    } else if(coolAt>=0&&i>=coolAt&&state>=2){
      if(state===2){temp-=so.pc/(m*so.cl+P.FCM);if(temp<=so.mp){temp=so.mp;state=3}}
      else if(state===3){phi-=so.pc/(m*so.Lf);if(phi<=0){phi=0;state=4}}
      else{temp-=so.pc/(m*so.cs+P.FCM);if(temp<so.tmin)temp=so.tmin}
    } else {
      if(state===0){temp+=pw/(m*so.cs+P.FCM);if(temp>=so.mp){temp=so.mp;state=1}}
      else if(state===1){phi+=pw/(m*so.Lf);if(phi>=1){phi=1;state=2}}
      else{temp+=pw/(m*so.cl+P.FCM);if(temp>P.TMAXM)temp=P.TMAXM}
    }
  }
  return {T:T,ph:ph,fr:fr,tend:tend};
}
function idxOf(r,t){return Math.max(0,Math.min(r.sim.T.length-1,Math.floor(t*60+1e-6)))}
function tempAt(r,t){
  var a=t*60, i=Math.max(0,Math.min(r.sim.T.length-2,Math.floor(a))), f=Math.min(1,Math.max(0,a-i));
  return r.sim.T[i]+(r.sim.T[i+1]-r.sim.T[i])*f;
}
/* 단계: 끓는점 → heat/boil/dry(모두 기체), 녹는점 → solid/melting/liquid. p = 남은 액체 비율 또는 녹은 비율 */
function phaseOf(r,t){
  var i=idxOf(r,t), k=r.sim.ph[i], p=r.sim.fr[i];
  if(r.tab==='boil') return {name:['heat','boil','dry'][k],p:p};
  return {name:['solid','melting','liquid','freezing','solid'][k],p:p};
}
/* 냉각 버튼: 팔미트산·로르산만. 다 녹은 뒤 일정 시간 가열한 다음에 나타남 */
function canCool(r){return r.tab==='melt'}
function coolReady(r){
  return canCool(r)&&!r.cool&&r.liqAt!==undefined&&r.t>=r.liqAt-1e-9&&
    (r.t>=r.liqAt+P.COOLWAIT-1e-9||tempAt(r,r.t)>=P.COOLTEMP-1e-6);   /* 다 녹은 뒤 5분 또는 85 ℃, 먼저 오는 쪽 */
}
function tabRuns(){return S.runs.filter(function(r){return r.tab===S.tab})}
function fmtT(v){return (Math.round(v*10)/10).toFixed(1)}
function fmtClock(min){
  var sec=Math.floor(min*60+1e-6), m=Math.floor(sec/60), s=sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function runName(r){return r.tab==='boil'?LIQ[r.liq].name+' '+r.vol+' mL':SOL[r.sol].name+' '+r.g+' g'}
/* 지금 선택한 조건과 같은 기록(없으면 null) */
/* 물·얼음 = 파란 계열, 에탄올·팔미트산 = 붉은 계열 */
function runFam(r){return (r.liq==='water'||r.sol==='ice')?'b':'d'}
function runColor(r){return 'var(--'+runFam(r)+(r.ci%6+1)+')'}
function shownRun(){
  var c=S.cur, s=sel();
  if(!c||c.tab!==S.tab) return null;
  if(c.tab==='boil'&&(c.liq!==s.liq||c.vol!==s.vol)) return null;
  if(c.tab==='melt'&&(c.sol!==s.sol||c.g!==s.g)) return null;
  return c;
}

/* ===== 실험 장치 그림 ===== */
function base(){
  return '<rect class="sc-table" x="0" y="322" width="420" height="18"/>'+
    '<rect class="sc-plate-body" x="100" y="296" width="220" height="26" rx="6"/>'+
    '<rect class="sc-plate-top" x="96" y="286" width="228" height="10" rx="4"/>'+
    '<circle id="led" class="sc-led" cx="122" cy="309" r="3.5"/>'+
    '<text class="sc-lbl" x="210" y="313" text-anchor="middle">가열장치</text>'+
    '<circle class="sc-knob" cx="298" cy="309" r="7"/>'+
    '<rect id="glow" class="sc-glow" x="140" y="278" width="140" height="8" rx="3" opacity="0"/>';
}
/* 삼각플라스크 안쪽 폭 (중심 x=210) */
function hw(y){return (y<205?20:20+(y-205)*0.5185)-3}
function polyAt(top,bot){
  var a=hw(top), b=hw(bot), c=210, p;
  if(top<205&&bot>205){
    var k=hw(205);
    p=[[c-a,top],[c+a,top],[c+k,205],[c+b,bot],[c-b,bot],[c-k,205]];
  } else p=[[c-a,top],[c+a,top],[c+b,bot],[c-b,bot]];
  return p.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ');
}
function bubbles(xs,y){
  return xs.map(function(x,i){return '<circle class="sc-bub" cx="'+x+'" cy="'+y+'" r="'+(3+(i%3))+'" style="animation-delay:'+(i*0.17).toFixed(2)+'s"/>'}).join('');
}
function renderScene(){
  var s=sel(), h=base(), liqH=0, cls='', tip=270;
  if(S.tab==='boil'&&s.liq&&s.vol>0){
    liqH=Math.min(78,10+s.vol*1.4);
    cls=s.liq==='ethanol'?'sc-liq-eth':'sc-liq-water';
  }
  var ice=s.sol==='ice'?' ice':'';
  if(s.flask){
    if(liqH) h+='<polygon id="liqPoly" data-h="'+liqH+'" class="'+cls+'" points="'+polyAt(286-liqH,286)+'"/>';
    if(S.tab==='melt'&&s.sol) h+='<polygon id="smLiq" class="sc-melt'+ice+'" points=""/><polygon id="smSol" class="sc-solid'+ice+'" points=""/>';
    if(s.chip) h+='<circle class="sc-chip" cx="190" cy="281" r="3"/><circle class="sc-chip" cx="208" cy="282" r="3"/><circle class="sc-chip" cx="230" cy="281" r="3"/>';
    h+='<g>'+bubbles([186,198,210,222,234],276)+'</g>';
    h+='<path class="sc-glass" d="M190 160V205L148 280Q146 286 152 286H268Q274 286 272 280L230 205V160"/>';
    h+='<path class="sc-steam" d="M200 152q-7-9 0-18t0-16"/><path class="sc-steam" d="M220 152q-7-9 0-18t0-16" style="animation-delay:.6s"/>';
    tip=liqH?286-liqH*0.55:(S.tab==='melt'&&s.sol?269:272);
  }
  if(s.beaker){
    if(s.bath) h+='<rect class="sc-bath" x="122" y="232" width="176" height="52"/>';
    h+='<path class="sc-glass" d="M120 200V282Q120 286 124 286H296Q300 286 300 282V200"/>';
  }
  if(s.sensor){
    h+='<path class="sc-cable" d="M232 60C270 44 330 44 372 84"/>'+
      '<line class="sc-sensor-line" x1="210" y1="94" x2="210" y2="'+tip.toFixed(1)+'"/>'+
      '<image href="'+SENSOR_HEAD+'" x="193.5" y="36" width="40" height="61.6"/>';
  }
  var svg=$('#scene');
  svg.setAttribute('class','');
  svg.innerHTML=h;
  updateScene();
}
function heating(){return !!(S.heater&&!(S.cur&&S.cur.cool))}
function updateScene(){
  var s=sel(), run=shownRun(), svg=$('#scene');
  var t=run?run.t:0;
  var ph=run?phaseOf(run,t):{name:S.tab==='melt'?'solid':'heat',p:0};
  svg.classList.toggle('boiling',!!(S.heater&&run&&ph.name==='boil'&&s.flask));
  var led=$('#led'); if(led) led.classList.toggle('on',heating());
  var gl=$('#glow'); if(gl) gl.setAttribute('opacity',heating()?'.55':'0');
  var lp=$('#liqPoly');
  if(lp){
    var H0=parseFloat(lp.getAttribute('data-h')), Lq=run&&run.tab==='boil'?ph.p:1, Hn=H0*Lq;
    lp.setAttribute('points',Hn>0.8?polyAt(286-Hn,286):'');
  }
  if(S.tab==='melt'&&s.sol){
    var HS=s.g>=200?52:34;
    var Lh=ph.name==='liquid'?HS:(ph.name==='melting'||ph.name==='freezing')?HS*ph.p:0, Sh=HS-Lh;
    var l=$('#smLiq'), so=$('#smSol');
    if(l) l.setAttribute('points',Lh>0.5?polyAt(286-Lh,286):'');
    if(so) so.setAttribute('points',Sh>0.5?polyAt(286-Lh-Sh,286-Lh):'');
  }
}

/* ===== 그래프 (가로 1칸 = 1분 · 세로 1칸 = 10 ℃. 끓는점·녹는점 모두 0~20분) ===== */
var G={ml:52,mt:14,mr:18,mb:48};
function geom(){
  var b=S.tab==='boil', cols=20, xstep=1, rows=b?16:12, ymin=b?0:-10, W=540, H=416;
  return {cols:cols,xstep:xstep,xmax:cols*xstep,rows:rows,ymin:ymin,ymax:ymin+rows*10,W:W,H:H,cw:W/cols,rh:H/rows,vw:G.ml+W+G.mr,vh:G.mt+H+G.mb};
}
function gx(t,g){return G.ml+Math.min(t,g.xmax)/g.xmax*g.W}
function gy(T,g){T=Math.max(g.ymin,Math.min(g.ymax,T));return G.mt+(g.ymax-T)/(g.ymax-g.ymin)*g.H}
function pathD(r,g){
  var d='', n=Math.ceil(r.t/0.1-1e-9), i, t;
  for(i=0;i<=n;i++){
    t=Math.min(r.t,i*0.1);
    d+=(i?'L':'M')+gx(t,g).toFixed(1)+' '+gy(tempAt(r,t),g).toFixed(1);
  }
  return d;
}
function drawGraph(){
  var g=geom(), svg=$('#graph'), s='', i, j, x, y;
  svg.setAttribute('viewBox','0 0 '+g.vw+' '+g.vh);
  s+='<rect class="g-bg" x="'+G.ml+'" y="'+G.mt+'" width="'+g.W+'" height="'+g.H+'"/>';
  for(i=0;i<=g.cols;i++){x=G.ml+i*g.cw;s+='<line class="g-major" x1="'+x.toFixed(1)+'" y1="'+G.mt+'" x2="'+x.toFixed(1)+'" y2="'+(G.mt+g.H)+'"/>'}
  for(j=0;j<=g.rows;j++){y=G.mt+j*g.rh;s+='<line class="g-major" x1="'+G.ml+'" y1="'+y.toFixed(1)+'" x2="'+(G.ml+g.W)+'" y2="'+y.toFixed(1)+'"/>'}
  s+='<line class="g-axis" x1="'+G.ml+'" y1="'+G.mt+'" x2="'+G.ml+'" y2="'+(G.mt+g.H)+'"/>';
  s+='<line class="g-axis" x1="'+G.ml+'" y1="'+(G.mt+g.H)+'" x2="'+(G.ml+g.W)+'" y2="'+(G.mt+g.H)+'"/>';
  if(S.tab==='melt'){y=gy(0,g);s+='<line class="g-axis" style="stroke-width:1.5" x1="'+G.ml+'" y1="'+y.toFixed(1)+'" x2="'+(G.ml+g.W)+'" y2="'+y.toFixed(1)+'"/>'}
  for(i=0;i<=g.cols;i++){s+='<text class="g-tick" x="'+(G.ml+i*g.cw).toFixed(1)+'" y="'+(G.mt+g.H+18)+'" text-anchor="middle">'+(i*g.xstep)+'</text>'}
  for(j=0;j<=g.rows;j++){var T=g.ymin+j*10;s+='<text class="g-tick" x="'+(G.ml-8)+'" y="'+(gy(T,g)+4).toFixed(1)+'" text-anchor="end">'+T+'</text>'}
  s+='<text class="g-title" x="'+(G.ml+g.W/2)+'" y="'+(g.vh-8)+'" text-anchor="middle">시간 (분)</text>';
  s+='<text class="g-title" transform="translate(13 '+(G.mt+g.H/2)+') rotate(-90)" text-anchor="middle">온도 (℃)</text>';
  var runs=tabRuns();
  runs.forEach(function(r){
    s+='<path id="rp'+r.id+'" class="g-run" style="stroke:'+runColor(r)+'" d="'+pathD(r,g)+'"/>';
  });
  runs.forEach(function(r){
    s+='<circle id="rd'+r.id+'" r="5.5" cx="'+gx(r.t,g).toFixed(1)+'" cy="'+gy(tempAt(r,r.t),g).toFixed(1)+'" style="fill:'+runColor(r)+';stroke:var(--plot-bg);stroke-width:2"/>';
  });
  runs.forEach(function(r){
    s+='<g id="rg'+r.id+'"><rect class="g-tagbg" rx="6" height="22" style="stroke:'+runColor(r)+'"/><text class="g-tag" y="15" style="fill:'+runColor(r)+'">'+esc(runName(r))+'</text></g>';
  });
  svg.innerHTML=s;
  placeTags();
}
/* 선 끝에 '물 10 mL' 같은 이름표 (서로 겹치지 않게 배치) */
function placeTags(){
  var g=geom(), items=[];
  tabRuns().forEach(function(r){
    var el=$('#rg'+r.id); if(!el) return;
    var txt=runName(r), w=Math.round(txt.length*8.6+14);
    var ex=gx(r.t,g), ey=gy(tempAt(r,r.t),g);
    var x=Math.max(G.ml+4,Math.min(G.ml+g.W-w-4,ex-w-10)), y=Math.max(G.mt+4,ey-30);
    items.push({el:el,w:w,x:x,y:y});
  });
  items.sort(function(a,b){return a.y-b.y});
  items.forEach(function(it,i){
    for(var j=0;j<i;j++){
      var o=items[j];
      if(it.x<o.x+o.w+4&&o.x<it.x+it.w+4&&Math.abs(it.y-o.y)<26) it.y=o.y+26;
    }
    it.y=Math.min(it.y,G.mt+g.H-26);
    var rc=it.el.firstChild, tx=it.el.lastChild;
    rc.setAttribute('x',it.x.toFixed(1));rc.setAttribute('y',it.y.toFixed(1));rc.setAttribute('width',it.w);
    tx.setAttribute('x',(it.x+7).toFixed(1));tx.setAttribute('y',(it.y+15).toFixed(1));
  });
}
function updateLive(){
  var r=S.cur; if(!r||r.tab!==S.tab) return;
  var g=geom(), p=$('#rp'+r.id), d=$('#rd'+r.id);
  if(p) p.setAttribute('d',pathD(r,g));
  if(d){d.setAttribute('cx',gx(r.t,g).toFixed(1));d.setAttribute('cy',gy(tempAt(r,r.t),g).toFixed(1))}
  placeTags();
}

/* ===== 화면 구성 ===== */
function renderTools(){
  var s=sel(), lock=S.heater?' disabled':'';
  $('#tools').innerHTML=SHELF[S.tab].map(function(id){
    var it=ITEMS[id], on, cnt='';
    if(id==='water'){
      on=s.liq==='water'||!!s.bath;
      cnt=s.liq==='water'?s.vol+' mL':(s.bath?'물중탕':(S.tab==='boil'?'+'+LIQ.water.step+' mL':''));
    } else if(it.kind==='liq'){
      on=s.liq===id;
      cnt=on?s.vol+' mL':'+'+LIQ[id].step+' mL';
    } else if(it.kind==='sol'){
      on=s.sol===id; cnt=on?s.g+' g':'+'+SOLSTEP+' g';
    } else on=!!s[id];
    return '<div class="tool"><button type="button" class="main" data-tool="'+id+'" aria-pressed="'+on+'"'+lock+'>'+
      ICONS[id]+'<span class="nm">'+it.n+'</span><span class="cnt">'+cnt+'</span>'+(it.cap?'<span class="cap">'+it.cap+'</span>':'')+'</button>'+
      ((it.kind==='liq'||it.kind==='sol')&&on?'<button type="button" class="x" data-x="'+id+'" aria-label="'+it.n+' 내려놓기"'+lock+'>✕</button>':'')+'</div>';
  }).join('');
}
function renderGuide(){
  var e=evalSetup(), s=sel(), sub=S.tab==='boil'?s.liq:s.sol, t, k='';
  if(S.note){t=S.note;k='warn'}
  else if(S.heater){
    var c=S.cur;
    t=c&&c.cool?'식히는 중이에요. 어는 동안 온도가 어떻게 변하는지 관찰해요.':(c&&coolReady(c)?'냉각하기를 눌러 식혀 봐요.':'온도 센서가 자동으로 기록해요.');
  }
  else if(!s.flask){t='1단계 삼각플라스크를 올려 주세요.'}
  else if(!sub){t='2단계 플라스크에 물질을 넣으세요.'}
  else if(!s.sensor){t='3단계 온도 센서를 꽂으세요.'}
  else if(e.extra.length){t='필요 없는 도구가 있어요. 다시 생각해 봐요.';k='warn'}
  else if(e.missing.length){t='도구가 더 필요해요. 다시 생각해 봐요.';k='warn'}
  else if(tabRuns().length>=6){t='기록이 가득 찼어요. 그래프 아래 ✕로 지워 주세요.';k='warn'}
  else if(shownRun()){t='조건을 바꿔 다시 실험하고 그래프를 비교해 봐요.'}
  else t='4단계 가열장치를 켜세요.';
  var el=$('#guide'); el.textContent=t; el.className='guide'+(k?' '+k:'');
}
function renderSafety(){
  var s=sel(), t;
  if(S.tab==='boil'){
    t='핫플레이트를 사용하거나 뜨거운 실험 기구를 다룰 때 화상을 입지 않도록 내열 장갑을 착용한다.';
    if(s.liq==='ethanol') t+=' 에탄올은 끓는점이 낮고 불이 붙기 쉬운 물질이므로 물중탕으로 서서히 가열한다.';
  } else t='핫플레이트와 뜨거운 물, 뜨거운 실험 기구에 화상을 입지 않도록 내열 장갑과 보안경을 착용한다.';
  $('#safety').textContent='안전  '+t;
}
function updateSmart(){
  var s=sel(), run=shownRun();
  var T=run?tempAt(run,run.t):(S.tab==='melt'&&s.sol?SOL[s.sol].t0:ROOM);
  $('#tNow').textContent=s.sensor?fmtT(T):'--.-';
  $('#timeNow').textContent=fmtClock(run?run.t:0);
}
function renderRuns(){
  var rs=tabRuns(), el=$('#runs');
  if(!rs.length){el.innerHTML='<li class="empty">가열하면 그래프가 자동으로 그려져요.</li>';return}
  el.innerHTML=rs.map(function(r){
    var active=S.heater&&S.cur===r;
    return '<li><i class="dot" style="background:'+runColor(r)+'"></i>'+esc(runName(r))+
      '<button type="button" data-del="'+r.id+'" aria-label="'+esc(runName(r))+' 기록 지우기"'+(active?' disabled':'')+'>✕</button></li>';
  }).join('');
}
function renderControls(){
  var b=$('#heat'), e=evalSetup();
  b.textContent=S.heater?(S.cur&&S.cur.cool?'측정 끝내기':'가열장치 끄기'):'가열장치 켜기';
  b.classList.toggle('on',S.heater);
  b.disabled=!S.heater&&(!e.ok||tabRuns().length>=6);
  [].forEach.call(document.querySelectorAll('.tabs button'),function(x){
    x.setAttribute('aria-selected',String(x.dataset.tab===S.tab));
  });
  updateCoolBtn();
}
function updateCoolBtn(){
  var r=S.cur, show=!!(S.heater&&r&&r.tab===S.tab&&coolReady(r));
  var b=$('#cool');
  if(b.hidden===show){
    b.hidden=!show;
    if(show&&!r.coolShown){r.coolShown=true;renderGuide()}
  }
}
function startCool(){
  var r=S.cur;
  if(!S.heater||!r||!coolReady(r)) return;
  r.cool=true; r.waitCool=false; r.coolAt=Math.floor(r.t*60+1e-6);
  r.sim=simulate(r,r.coolAt); r.tmax=r.sim.tend/60;
  S.note='';
  renderGuide(); renderControls(); updateScene();
}
function renderAll(){
  $('#app').setAttribute('data-tab',S.tab);
  renderTools(); renderGuide(); renderSafety(); renderScene();
  updateSmart(); drawGraph(); renderRuns(); renderControls();
}
function refocus(sel){var n=document.querySelector(sel);if(n&&!n.disabled)n.focus()}

/* ===== 가열 · 기록 ===== */
function startHeat(){
  var e=evalSetup(), s=sel();
  if(!e.ok||tabRuns().length>=6) return;
  var used={}, ci=0;
  var fam=runFam({liq:s.liq,sol:s.sol});
  tabRuns().forEach(function(r){if(runFam(r)===fam)used[r.ci]=1});
  while(used[ci]) ci++;
  var run={id:++S.uid,tab:S.tab,liq:s.liq,vol:s.vol,sol:s.sol,g:s.g,ci:ci,t:0,dryShown:false};
  run.sim=simulate(run); run.tmax=run.sim.tend/60;
  if(run.tab==='melt'){
    var k=0; while(k<run.sim.ph.length&&run.sim.ph[k]!==2) k++;
    run.liqAt=k<run.sim.ph.length?k/60:undefined;
  }
  S.runs.push(run); S.cur=run; S.heater=true; S.note='';
  renderAll();
}
function stopHeat(){S.heater=false;S.note='';renderAll()}
var last=performance.now();
function frame(ts){
  var dt=Math.min(0.1,Math.max(0,(ts-last)/1000));
  last=ts;
  if(S.heater&&S.cur&&!S.paused&&!S.cur.waitCool){
    var r=S.cur;
    r.t=Math.min(r.tmax,r.t+dt*SPEED[r.tab]);
    updateLive(); updateScene(); updateSmart(); updateCoolBtn();
    var ph=phaseOf(r,r.t);
    if(r.tab==='boil'&&ph.name==='dry'&&!r.dryShown){r.dryShown=true;showDry(r)}
    else if(canCool(r)&&!r.cool&&!r.coolPop&&coolReady(r)){r.coolPop=true;r.waitCool=true;showCool()}   /* 냉각하기를 누를 때까지 시간이 멈춤 */
    else if(r.t>=r.tmax-1e-9){
      var hot=r.tab==='boil'&&r.tmax<tmaxMin('boil')-1e-6;
      stopHeat();
      if(hot){S.note='온도가 150 ℃에 도달해 안전을 위해 가열장치가 꺼졌어요.';renderGuide()}
      else if(r.tab==='boil'&&ph.name!=='dry'){S.note='정해진 시간이 끝나 가열장치가 꺼졌어요. 액체가 아직 남아 있어서 온도가 일정했어요.';renderGuide()}
      else if(r.tab==='melt'){S.note=(r.cool&&r.tmax<tmaxMin('melt')-1e-6)?'충분히 식어서 측정이 끝났어요.':'정해진 시간이 끝나 측정이 끝났어요.';renderGuide()}
    }
  }
  requestAnimationFrame(frame);
}
/* 액체가 모두 기체가 되면 알림 (게임이 멈추고, 확인을 누르면 계속) */
function showDry(r){
  var w=r.liq==='water';
  $('#mTitle').textContent=w?'물이 모두 수증기가 되었어요':'에탄올이 모두 기체가 되었어요';
  $('#mBody').textContent=w
    ?'액체가 모두 기체로 변하면 더 이상 끓는 상태가 아니어서, 온도가 100 ℃보다 높아질 수 있어요. 실제 실험에서는 액체가 다 증발하기 전에 가열을 꺼야 안전해요.'
    :'더 이상 끓지 않으니 온도가 78.2 ℃보다 높아질 수 있어요. 다만 물중탕이라 물의 끓는점인 100 ℃ 가까이까지만 올라가요.';
  S.paused=true;
  openModal();
}
/* 다 녹은 뒤 5분 가열하면 냉각 안내 (확인을 누르면 냉각하기 버튼을 쓸 수 있음) */
function showCool(){
  $('#mTitle').textContent='❄️ 이제 식혀 볼까요?';
  $('#mBody').textContent='시료가 모두 녹은 뒤 충분히 가열했어요. 냉각하기 버튼을 눌러 식히면서, 어는 동안 온도가 어떻게 변하는지 관찰해 보세요.';
  S.paused=true;
  openModal('cool');
}
function openModal(kind){
  $('#modal').classList.toggle('cool',kind==='cool');
  $('#modal').hidden=false;
  $('#mOk').focus();
}
$('#mOk').addEventListener('click',function(){
  $('#modal').hidden=true;S.paused=false;last=performance.now();
  var cb=$('#cool'); if(cb&&!cb.hidden) cb.focus();
});

/* ===== 이벤트 ===== */
$('.tabs').addEventListener('click',function(e){
  var b=e.target.closest('button[data-tab]'); if(!b||b.dataset.tab===S.tab) return;
  if(S.heater){S.note='가열 중에는 바꿀 수 없어요. 가열장치를 먼저 꺼요.';renderGuide();return}
  S.tab=b.dataset.tab; S.note='';
  renderAll();
});
function removeFlask(){
  var s=sel();
  s.flask=0; s.sensor=0; s.chip=0;
  if(S.tab==='boil'){s.liq=null;s.vol=0} else {s.sol=null;s.g=0}
}
function addLiquid(s,id){
  if(s.liq!==id){s.liq=id;s.vol=LIQ[id].step}
  else s.vol=Math.min(LIQ[id].max,s.vol+LIQ[id].step);
}
$('#tools').addEventListener('click',function(e){
  if(S.heater) return;
  var s=sel(), b=e.target.closest('button'); if(!b) return;
  var id=b.dataset.tool||b.dataset.x; if(!id) return;
  var note='', NOFLASK='먼저 삼각플라스크를 올려 주세요.';
  if(b.dataset.x){
    if(id==='water'&&s.liq==='water'){s.liq=null;s.vol=0}
    else if(id==='water') s.bath=0;
    else if(ITEMS[id].kind==='sol'){s.sol=null;s.g=0}
    else {s.liq=null;s.vol=0}
  }
  else if(id==='flask'){ if(s.flask) removeFlask(); else s.flask=1 }
  else if(id==='beaker'){ if(s.beaker){s.beaker=0;s.bath=0} else s.beaker=1 }
  else if(id==='water'){
    if(s.beaker&&!s.bath) s.bath=1;                 /* 비커가 있으면 물은 물중탕이 됨 */
    else if(S.tab==='melt') note=s.beaker?'':'먼저 비커를 놓아 주세요.';
    else if(!s.flask) note=NOFLASK;
    else addLiquid(s,'water');
  }
  else if(id==='ethanol'){
    if(!(s.beaker&&s.bath)){                         /* 물중탕이 준비되지 않았으면 위험 */
      if(s.flask) removeFlask();
      $('#mTitle').textContent='[주의]';
      $('#mBody').textContent='에탄올은 인화성이 있어 직접 가열하면 위험합니다. 비커 → 물 → 플라스크 순서로 설치하여 물중탕하세요.';
      openModal();
    }
    else if(!s.flask) note=NOFLASK;
    else addLiquid(s,'ethanol');
  }
  else if(ITEMS[id].kind==='sol'){
    if(!s.flask) note=NOFLASK;
    else if(s.sol!==id){s.sol=id;s.g=SOLSTEP}            /* 처음 누르면 100 g */
    else s.g=Math.min(SOLMAX,s.g+SOLSTEP);              /* 또 누르면 200 g */
  }
  else if(id==='sensor'||id==='chip'){
    if(!s.flask) note=NOFLASK; else s[id]=s[id]?0:1;
  }
  S.note=note;
  renderAll(); refocus('[data-tool="'+id+'"]');
});
$('#cool').addEventListener('click',startCool);
$('#heat').addEventListener('click',function(){
  if(S.heater) stopHeat(); else startHeat();
});
$('#runs').addEventListener('click',function(e){
  var b=e.target.closest('button[data-del]'); if(!b||b.disabled) return;
  var id=b.dataset.del;
  S.runs=S.runs.filter(function(r){return String(r.id)!==id});
  if(S.cur&&String(S.cur.id)===id) S.cur=null;
  renderAll();
});
var armTimer=null;
$('#resetAll').addEventListener('click',function(){
  var b=this;
  if(!b.classList.contains('armed')){
    b.classList.add('armed'); b.textContent='한 번 더 누르세요';
    armTimer=setTimeout(function(){b.classList.remove('armed');b.textContent='전체 초기화'},3500);
    return;
  }
  clearTimeout(armTimer); b.classList.remove('armed'); b.textContent='전체 초기화';
  S.heater=false; S.paused=false; $('#modal').hidden=true; S.cur=null; S.runs=[]; S.note='';
  S.sel={boil:{liq:null,vol:0,flask:0,beaker:0,bath:0,sensor:0,chip:0},melt:{sol:null,g:0,flask:0,beaker:0,bath:0,sensor:0,chip:0}};
  renderAll();
});

renderAll();
requestAnimationFrame(frame);
})();
</script>
